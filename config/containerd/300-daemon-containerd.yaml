apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: freeze-daemon-containerd
  namespace: knative-serving
spec:
  selector:
    matchLabels:
      name: freeze-daemon-containerd
  template:
    metadata:
      labels:
        name: freeze-daemon-containerd
    spec:
      serviceAccountName: freeze-tokenreview
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: daemon
          securityContext:
            runAsUser: 0
          image: ghcr.io/pmacoutinho/freezer-daemon:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUNTIME_TYPE
              value: "containerd"
            - name: CONTAINERD_ADDRESS
              value: /run/k3s/containerd/containerd.sock
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: freezer-api-key
                  key: api-key
                  optional: true
            - name: FREEZER_LOGGING_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: config-freezer
                  key: freezer-logging-config
            - name: FREEZER_LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: config-freezer
                  key: freezer-logging-level
          ports:
            - containerPort: 8080
              hostPort: 9696
          volumeMounts:
            - name: containerd-socket
              mountPath: /run/k3s/containerd
            - name: pods-log
              mountPath: /var/log/pods
            - name: freezer-fifo
              mountPath: /run/freezer-fifo
            - name: freezer-checkpoints
              mountPath: /var/lib/freezer-checkpoints
            # Read-only host root so the capability probe can stat the host's
            # criu binary (the freeze path shells out to criu on the host).
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        # Mount the containerd run directory (not the .sock file) so that a
        # containerd restart, which recreates the socket as a new inode, is
        # picked up live instead of stranding the daemon on a dead socket.
        - name: containerd-socket
          hostPath:
            path: /run/k3s/containerd
            type: Directory
        - name: pods-log
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: freezer-fifo
          hostPath:
            path: /run/freezer-fifo
            type: DirectoryOrCreate
        # Checkpoint images must be on persistent storage, not tmpfs, so that
        # checkpointing actually frees RAM.
        - name: freezer-checkpoints
          hostPath:
            path: /var/lib/freezer-checkpoints
            type: DirectoryOrCreate
        - name: host-root
          hostPath:
            path: /
            type: Directory

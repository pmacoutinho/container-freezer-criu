apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-container-restart-policy-never
  annotations:
    policies.kyverno.io/title: Inject restartPolicy Never on checkpoint-enabled Knative user containers
    policies.kyverno.io/description: >-
      Knative Serving's field mask strips the per-container restartPolicy field
      (ContainerRestartRules, k8s v1.34+). This policy injects restartPolicy: Never
      on the user-container in Deployments created by Knative Serving for
      checkpoint-enabled services, so that kubelet does not restart the container
      after a CRIU checkpoint kills it. It matches only Deployments carrying the
      qpoption.knative.dev/freezer-activate=enable annotation, which the MEC operator
      sets on checkpoint-enabled services and Knative copies onto the Deployment;
      other Knative services keep the default restart behavior.
spec:
  rules:
    - name: set-restart-policy-never
      match:
        any:
          - resources:
              kinds:
                - Deployment
              selector:
                matchLabels:
                  serving.knative.dev/service: "*"
              annotations:
                qpoption.knative.dev/freezer-activate: "enable"
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                containers:
                  - name: user-container
                    restartPolicy: Never
